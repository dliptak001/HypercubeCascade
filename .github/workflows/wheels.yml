# Python wheels build the vendored HypercubeCNN (third_party/) in-tree with the
# extension — see third_party/HypercubeCNN/VENDORED.md. Packaging root: python/.
#
# PyPI trusted publisher (OIDC, no API token) — set up once before first tag:
#   Project:  hypercube-cascade
#   Owner:    dliptak001
#   Repo:     HypercubeCascade
#   Workflow: wheels.yml
#
# Publish runs only on tags matching v* (e.g. v1.0.0). skip-existing avoids
# failing when re-running a tag after a partial upload.

name: Build wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v6

      # Register binfmt so cibuildwheel can build Linux aarch64 wheels via emulation.
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: pypa/cibuildwheel@v4.0.0
        with:
          package-dir: python
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Archives the python/ package tree for PyPI completeness. From-source
      # installs still need a full repo clone (core + third_party sit outside
      # python/) — see docs/Python_SDK.md.
      - run: pipx run build --sdist python

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: python/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
